name: daily update and deploy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: scrape
        run: python scraper.py

      - name: Build static site
        run: python build_site.py

      # Deploy Pages from built site/ BEFORE git push, so a push race cannot
      # skip publishing a good artifact (root cause of empty live builds_d2core).
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # OIDC ID token requests occasionally time out on GitHub's side
      # ("Failed to get ID Token ... Request timeout"); wait and retry once.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # Keep scraped data even if deploy failed, so the day's data isn't lost.
      - name: Commit updated data
        if: ${{ !cancelled() && steps.scrape.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "daily data update $(date -u +%F)"
            # Retry push after rebase — concurrent workflow_dispatch races were
            # rejecting push and previously aborted deploy (now deploy is above).
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push OK"
                exit 0
              fi
              echo "Push rejected (attempt $i), rebasing onto origin/main..."
              git pull --rebase origin main || git rebase --abort || true
              sleep $((i * 2))
            done
            echo "WARNING: could not push data commit after retries; Pages already deployed"
            exit 0
          fi
